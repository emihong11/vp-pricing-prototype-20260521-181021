<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP Pricing Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --navy: #012939;
      --navy-mid: #344F61;
      --green: #B8E833;
      --surface: #F7F5F1;
      --border: #CAD7DC;
      --white: #FFFFFF;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--navy);
      background: var(--surface);
    }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .stage { flex: 1; min-height: 0; padding: 0; }
    iframe {
      width: 100%;
      height: 100vh;
      min-height: 720px;
      border: 0;
      border-radius: 0;
      background: var(--white);
      display: block;
    }
    @media (max-width: 800px) {
      iframe { min-height: 640px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="stage">
      <iframe id="prototype-frame" title="Full process pricing" src="2026-05-18 full process pricing v.1.html"></iframe>
    </main>
  </div>
</body>
</html>
